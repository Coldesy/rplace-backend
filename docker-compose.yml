services:
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: laksh
      POSTGRES_PASSWORD: laksh
      POSTGRES_DB: rplace
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
volumes:
  pg_data:
  redis_data: